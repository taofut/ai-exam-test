[project]
name = "materialops-exam"
version = "0.1.0"
description = "MaterialOps AI full-stack tier exam starter backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/materialops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = "../../runtime/cache/pytest"
addopts = "-m 'not starter'"
markers = ["starter: organizer-only assertions about the unimplemented starting scaffold"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning"]

